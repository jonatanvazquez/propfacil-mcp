name: Publish to Official MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Match a release tag to server.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(jq -r '.version' server.json)"
          test "$actual" = "$expected"

      - name: Validate server metadata
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -X POST https://registry.modelcontextprotocol.io/v0.1/validate \
            -H 'content-type: application/json' \
            --data-binary @server.json)"
          printf '%s\n' "$response" | jq .
          test "$(printf '%s\n' "$response" | jq -r '.valid')" = "true"

      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish
