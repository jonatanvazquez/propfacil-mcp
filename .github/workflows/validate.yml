name: Validate distribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate server.json with the Official MCP Registry
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            -X POST https://registry.modelcontextprotocol.io/v0.1/validate \
            -H 'content-type: application/json' \
            --data-binary @server.json)"
          printf '%s\n' "$response" | jq .
          test "$(printf '%s\n' "$response" | jq -r '.valid')" = "true"

      - name: Smoke-test the production MCP server
        shell: bash
        run: |
          initialize="$(curl --fail-with-body --silent --show-error \
            -X POST https://www.propfacil.com/api/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-06-18' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"distribution-check","version":"1.0.0"}}}')"
          printf '%s\n' "$initialize" | jq -e '.result.serverInfo.name == "propfacil" and .result.serverInfo.version == "1.3.8"'

          tools="$(curl --fail-with-body --silent --show-error \
            -X POST https://www.propfacil.com/api/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-06-18' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          printf '%s\n' "$tools" | jq -e '.result.tools | length == 13'
          printf '%s\n' "$tools" | jq -e '[.result.tools[] | select(._meta["openai/visibility"] != "private")] | length == 12'
          printf '%s\n' "$tools" | jq -e '[.result.tools[] | select(.name == "restore_property_results" and ._meta["openai/visibility"] == "private")] | length == 1'
          printf '%s\n' "$tools" | jq -e '[.result.tools[] | has("inputSchema") and has("outputSchema") and has("annotations") and has("securitySchemes")] | all'

      - name: Check public metadata and policy URLs
        shell: bash
        run: |
          for url in \
            https://www.propfacil.com/.well-known/mcp/server-card.json \
            https://www.propfacil.com/.well-known/oauth-protected-resource \
            https://www.propfacil.com/.well-known/oauth-authorization-server \
            https://www.propfacil.com/brand/propfacil-icon-512.png \
            https://www.propfacil.com/privacidad \
            https://www.propfacil.com/terminos \
            https://www.propfacil.com/soporte
          do
            curl --fail-with-body --silent --show-error --location --output /dev/null "$url"
          done

      - name: Verify bundled assets
        shell: bash
        run: |
          file assets/propfacil-icon-512.png | grep -q '512 x 512'
          file assets/propfacil-icon-400.png | grep -q '400 x 400'
          test -s assets/propfacil-logo.svg
          test -s assets/propfacil-mark.svg
